# Production deploys are handled by Vercel ↔ GitHub integration on the
# supplier-portal project (https://supplier-portal-zm.vercel.app).
#
# This workflow is optional: run manually after updating GitHub secret VERCEL_TOKEN
# (create at https://vercel.com/account/tokens).

name: Deploy to Vercel (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_Mpc0Y2EvTbk9SnbrSoYQ5g7S
          VERCEL_PROJECT_ID: prj_8eXgrHquFsQkxEaRDdYkUwoLYV8T

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_Mpc0Y2EvTbk9SnbrSoYQ5g7S
          VERCEL_PROJECT_ID: prj_8eXgrHquFsQkxEaRDdYkUwoLYV8T

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_Mpc0Y2EvTbk9SnbrSoYQ5g7S
          VERCEL_PROJECT_ID: prj_8eXgrHquFsQkxEaRDdYkUwoLYV8T
